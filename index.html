<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ふらっと｜外出の一歩を決める</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#23392f;background:#f5f7f2}*{box-sizing:border-box}body{margin:0}.app{max-width:570px;margin:auto;padding:22px 18px 64px;min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:24px;font-weight:850;letter-spacing:.05em}.pill{font-size:12px;border-radius:30px;background:#e5efe4;padding:8px 11px}.progress{height:5px;border-radius:8px;background:#dfe7dc;margin-bottom:24px;overflow:hidden}.progress div{height:100%;background:#4f8664;transition:width .2s}.card{background:white;border:1px solid #e0e7dd;border-radius:23px;padding:26px 22px;box-shadow:0 10px 30px #25382a0a}.kicker{font-size:12px;font-weight:800;color:#6c8b73;letter-spacing:.06em}h1{font-size:26px;line-height:1.45;margin:9px 0 12px}h2{font-size:18px;margin:15px 0 8px}p{color:#52645a;line-height:1.8;margin:9px 0 15px}.hint{font-size:13px;color:#66766c;background:#f2f6f0;border-radius:13px;padding:12px;line-height:1.7}.choices{display:grid;gap:10px;margin:20px 0}.choice{border:1.5px solid #dce5da;border-radius:15px;background:#fff;padding:15px;text-align:left;font:inherit;color:inherit;cursor:pointer;line-height:1.6}.choice.active{background:#edf6ed;border-color:#4b8a62;box-shadow:inset 0 0 0 1px #4b8a62}.choice small{display:block;color:#718174;font-size:12px;margin-top:3px}.btn{border:0;border-radius:14px;background:#356c4d;color:white;padding:15px 18px;font:inherit;font-weight:750;width:100%;cursor:pointer;margin-top:12px}.btn:disabled{background:#b5c2b7;cursor:not-allowed}.btn.light{background:#edf2eb;color:#365d44}.back{display:block;border:0;background:none;color:#56755d;text-decoration:underline;font:inherit;margin:16px auto 0;cursor:pointer}.dest{border:1.5px solid #e0e7dc;border-radius:16px;padding:16px;margin:12px 0}.dest.active{border-color:#52886a;background:#f1f7ef}.dest h2{margin:0 0 5px}.dest p{margin:5px 0;font-size:14px}.meta{font-size:12px;color:#68806e;font-weight:700}.row{display:flex;gap:9px;flex-wrap:wrap}.chip{display:inline-block;background:#edf2ea;padding:5px 9px;border-radius:20px;font-size:12px;color:#58715e}.panel{background:#edf5e9;border-radius:17px;padding:18px;margin:20px 0}.panel strong{font-size:20px}.panel p{margin-bottom:0}.label{font-weight:700;font-size:14px;display:block;margin:20px 0 8px}textarea{width:100%;min-height:90px;border:1px solid #d5dfd3;border-radius:12px;padding:12px;font:inherit;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 inherit;background:#f2f5f0;padding:14px;border-radius:12px;max-height:270px;overflow:auto}.status{font-size:13px;color:#386849;margin-top:10px}footer{text-align:center;color:#829083;font-size:12px;margin-top:24px;line-height:1.7}@media(max-width:390px){h1{font-size:23px}.card{padding:22px 17px}}
</style>
</head>
<body><main class="app"><header class="header"><span class="logo">ふらっと 🌿</span><span class="pill">体験テスト版 2</span></header><div class="progress"><div id="bar"></div></div><section class="card" id="screen" aria-live="polite"></section><footer>このアプリは検証用の試作品です。候補の所要時間・営業状況は保証されません。<br>回答は自動送信されません。</footer></main>
<script>
const $=s=>document.querySelector(s);
const state={time:null,company:null,energy:null,place:null,first:null,decision:null,good:'',bad:'',idea:''};let step=0;
const destinations=[
{id:'walk',name:'近くを少し散歩',type:'自然・散歩',duration:15,energy:'low',company:'solo',desc:'気になる景色をひとつ見つける。目的地を決めずに出られる、短い寄り道。',first:['靴を履いて玄関へ','まず5分だけ歩く','出発する時刻を決める']},
{id:'street',name:'寄井商店街を歩く',type:'街歩き',duration:30,energy:'mid',company:'both',desc:'商店街の雰囲気を楽しみながら、気になるお店や風景を探してみる。',first:['行き方を確認する','一緒に行く人を誘う','出発する時刻を決める']},
{id:'roadside',name:'道の駅 温泉の里神山に立ち寄る',type:'お店・寄り道',duration:45,energy:'mid',company:'both',desc:'売り場をのぞいて、気になるものをひとつ探す。',first:['営業時間を確認する','行き方を確認する','出発する時刻を決める']},
{id:'nature',name:'近くの自然を見に行く',type:'景色・自然',duration:30,energy:'mid',company:'both',desc:'空や山、川など、いつもと違う景色に目を向ける。',first:['行き先を一か所決める','誰かを誘ってみる','出発する時刻を決める']}
];
const timeOptions=[['15','15分くらい'],['30','30分くらい'],['60','1時間くらい']];
const companyOptions=[['solo','一人で行きたい'],['invite','誰かと行けたらうれしい'],['either','どちらでもいい']];
const energyOptions=[['low','できるだけ気軽に'],['mid','少しなら移動してもいい']];
const decisionOptions=[['go','行ってみようと思う'],['later','また今度なら行きたい'],['no','今回は行かない']];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=(opts,val)=>opts.find(x=>x[0]===val)?.[1]||'未回答';
function choices(key,opts){return `<div class="choices">${opts.map(([id,text])=>`<button class="choice ${state[key]===id?'active':''}" type="button" data-key="${key}" data-value="${id}" aria-pressed="${state[key]===id}">${escapeHTML(text)}</button>`).join('')}</div>`}
function candidates(){let max=Number(state.time||60);return destinations.map(d=>({...d,score:(d.duration<=max?3:0)+(state.energy==='low'&&d.energy==='low'?2:0)+(state.company==='solo'&&d.company==='solo'?1:0)})).filter(d=>d.duration<=max).sort((a,b)=>b.score-a.score||a.duration-b.duration).slice(0,3)}
function nextButton(text,disabled=false){return `<button class="btn" id="next" ${disabled?'disabled':''}>${text}</button>`}
function render(){ $('#bar').style.width=`${(step+1)/6*100}%`;let h='';
if(step===0)h=`<div class="kicker">STEP 1 / 6 · はじめに</div><h1>「行きたいけど、やめておこう」を、少し減らせる？</h1><p>外出したい気持ちはあるのに、行き先が決まらなかったり、面倒になったり。そんなときに、行き先と最初の一歩を決める体験です。</p><div class="hint">約3分のテストです。神山で暮らしている学生になったつもりで試してください。実際に外出する必要はありません。</div>${nextButton('体験を始める')}`;
if(step===1)h=`<div class="kicker">STEP 2 / 6 · 今の状況</div><h1>今日は、どんな外出ならできそう？</h1><h2>使える時間</h2>${choices('time',timeOptions)}<h2>誰と行きたい？</h2>${choices('company',companyOptions)}<h2>今の気力</h2>${choices('energy',energyOptions)}${nextButton('行き先を見てみる',!state.time||!state.company||!state.energy)}`;
if(step===2){const list=candidates();h=`<div class="kicker">STEP 3 / 6 · 行き先を選ぶ</div><h1>こんな寄り道はどう？</h1><p>気になる候補を一つ選んでください。時間は実測ではなく体験用の目安です。</p>${list.map(d=>`<div class="dest ${state.place===d.id?'active':''}"><div class="row"><span class="chip">${d.type}</span><span class="chip">体験用目安 ${d.duration}分</span></div><h2>${d.name}</h2><p>${d.desc}</p><button class="btn ${state.place===d.id?'light':''}" data-place="${d.id}">${state.place===d.id?'選択中 ✓':'ここにしてみる'}</button></div>`).join('')}${nextButton('この行き先で進む',!list.some(d=>d.id===state.place))}`}
if(step===3){const d=destinations.find(x=>x.id===state.place);h=`<div class="kicker">STEP 4 / 6 · 最初の一歩</div><h1>行くなら、何から始める？</h1><div class="panel"><strong>${d.name}</strong><p>${d.desc}</p></div><p>「行こうかな」で終わらないように、最初の行動を一つ決めてみましょう。</p>${choices('first',d.first.map((v,i)=>[String(i),v]))}${nextButton('一歩目を決める',state.first===null)}`}
if(step===4){const d=destinations.find(x=>x.id===state.place);h=`<div class="kicker">STEP 5 / 6 · 行動を決める</div><h1>ここまで決められました</h1><div class="panel"><div class="meta">行き先</div><strong>${d.name}</strong><p><b>最初の一歩：</b>${d.first[Number(state.first)]}</p></div><h2>この計画なら、どうしたい？</h2>${choices('decision',decisionOptions)}${nextButton('フィードバックへ',!state.decision)}`}
if(step===5)h=`<div class="kicker">STEP 6 / 6 · フィードバック</div><h1>体験してみて、どうでしたか？</h1><p>率直な感想を教えてください。書けるところだけで大丈夫です。</p><label class="label" for="good">行き先や一歩目を決める体験で、良かったところ</label><textarea id="good" placeholder="例：候補が少なくて選びやすかった">${escapeHTML(state.good)}</textarea><label class="label" for="bad">迷ったところ・実際には使わなさそうな理由</label><textarea id="bad" placeholder="例：移動時間が分からないと決められない">${escapeHTML(state.bad)}</textarea><label class="label" for="idea">こうだったらもっと使いたい</label><textarea id="idea" placeholder="例：友達を誘える機能がほしい">${escapeHTML(state.idea)}</textarea>${nextButton('回答をまとめる')}<div id="resultArea"></div>`;
$('#screen').innerHTML=h+(step>0?'<button class="back" id="back">前に戻る</button>':'');
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const key=b.dataset.key;state[key]=b.dataset.value;if(key==='time'){state.place=null;state.first=null}render()});
document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{state.place=b.dataset.place;state.first=null;render()});
if($('#next'))$('#next').onclick=()=>{if(step===5){['good','bad','idea'].forEach(k=>state[k]=$('#'+k).value.trim());showResult();return}step++;render();scrollTo(0,0)};
if($('#back'))$('#back').onclick=()=>{if(step===5)['good','bad','idea'].forEach(k=>state[k]=$('#'+k).value);step--;render();scrollTo(0,0)};
}
function summary(){const d=destinations.find(x=>x.id===state.place);return `【ふらっと｜テストプレイ結果】\n使える時間：${label(timeOptions,state.time)}\n同行希望：${label(companyOptions,state.company)}\n気力：${label(energyOptions,state.energy)}\n選んだ行き先：${d?.name||'未回答'}\n最初の一歩：${d?.first[Number(state.first)]||'未回答'}\n行動意向：${label(decisionOptions,state.decision)}\n良かったところ：${state.good||'未記入'}\n迷ったところ：${state.bad||'未記入'}\n改善案：${state.idea||'未記入'}`}
function showResult(){const el=$('#screen');el.innerHTML=`<div class="kicker">体験完了</div><h1>ご協力ありがとうございます！</h1><p>回答をコピーして、テストを依頼した人に送ってください。</p><pre id="result">${escapeHTML(summary())}</pre><button class="btn" id="copy">回答をコピー</button><div id="status" class="status" role="status"></div><button class="btn light" id="restart">最初からやり直す</button><p class="hint">回答は自動送信されません。コピーしてDMなどで共有してください。</p>`;$('#bar').style.width='100%';$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());$('#status').textContent='コピーしました。DMなどに貼り付けてください。'}catch(e){const r=document.createRange();r.selectNodeContents($('#result'));const s=window.getSelection();s.removeAllRanges();s.addRange(r);$('#status').textContent='コピーできなかったため、回答文を選択しました。手動でコピーしてください。'}};$('#restart').onclick=()=>{if(confirm('回答を消してやり直しますか？'))location.reload()};scrollTo(0,0)}
render();
</script></body></html>
